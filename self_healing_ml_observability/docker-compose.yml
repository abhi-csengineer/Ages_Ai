version: "3.9"

services:
  ml-observability-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ml-observability-app
    ports:
      - "8000:8000"
    environment:
      - AEGIS_FEATURE_STORE_BACKEND=qdrant
      - AEGIS_QDRANT_URL=http://qdrant:6333
      - AEGIS_QDRANT_COLLECTION=ml_inference_logs
      - AEGIS_VECTOR_SIZE=24
      - AEGIS_DETECTION_WINDOW_SIZE=20000
      - AEGIS_REDIS_URL=redis://redis:6379/0
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - qdrant
      - redis

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.12
    container_name: ml-observability-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --check=false
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=redpanda:8082
    ports:
      - "9092:9092"
      - "8082:8082"

  qdrant:
    image: qdrant/qdrant:v1.11.5
    container_name: ml-observability-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"

  redis:
    image: redis:7.4-alpine
    container_name: ml-observability-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: ml-observability-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - ml-observability-app

  grafana:
    image: grafana/grafana:11.2.2
    container_name: ml-observability-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
